{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Devfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="cursor-glow"></div>
    <div id="scene-canvas"></div>

    {% include 'core/partials/navbar.html' %}
    {% include 'core/partials/sidebar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'core/partials/footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="{% static 'core/js/scene.js' %}"></script>
    <script src="{% static 'core/js/cursor-glow.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
